<script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('preaCalculator', () => ({
                // Gerbang Keamanan (Access Gate)
                isUnlocked: localStorage.getItem('prea_unlocked') === 'true',
                inputCode: '',
                codeError: false,
                correctCode: 'prea123', // <-- Password diatur menjadi prea123

                verifyCode() {
                    if (this.inputCode.trim().toLowerCase() === this.correctCode.toLowerCase()) {
                        this.isUnlocked = true;
                        localStorage.setItem('prea_unlocked', 'true');
                        this.codeError = false;
                        this.initChart();
                    } else {
                        this.codeError = true;
                    }
                },

                lockApp() {
                    this.isUnlocked = false;
                    localStorage.removeItem('prea_unlocked');
                    this.inputCode = '';
                },

                tab: 1,
                formData: {
                    nama: 'Bunda Inspiratif',
                    tanggunganOrg: 2,
                    usiaSekarang: 45,
                    targetPensiun: 55,
                    harapanHidup: 75,
                    gajiBulanan: 10000000,
                    penghasilanSampingan: 2000000,
                    passiveIncome: 1000000,
                    pengeluaranRutin: 6000000,
                    cicilanUtang: 1500000,
                    sisaBulanCicilan: 24,
                    hartaTunai: 30000000,
                    hartaInvestasi: 150000000,
                    emasGram: 50,
                    hargaEmasGram: 1200000,
                    hartaPribadi: 500000000,
                    estimasiJHT: 75000000,
                    estimasiDPLK: 25000000,
                    estimasiPesangon: 50000000,
                    listTanggungan: [
                        { jenis: 'Pendidikan Anak', nominal: 1500000, sisaBulan: 36 }
                    ],
                    listRencana: [
                        { jenis: 'Ibadah Haji/Umroh', nominal: 50000000 }
                    ],
                    modalBisnisNominal: 25000000,
                    targetProfitBisnis: 1000000,
                    ember2Sukuk: 50000000,
                    kuponSukukPersen: 6.5,
                    passiveIncomePensiun: 1500000
                },

                init() {
                    const saved = localStorage.getItem('prea_calculator_data');
                    if (saved) {
                        try { this.formData = JSON.parse(saved); } catch (e) {}
                    }
                    if (this.isUnlocked) {
                        setTimeout(() => this.initChart(), 300);
                    }
                },

                persist() {
                    localStorage.setItem('prea_calculator_data', JSON.stringify(this.formData));
                    this.updateChart();
                },

                switchTab(t) {
                    this.tab = t;
                    if (t === 5) {
                        setTimeout(() => this.initChart(), 100);
                    }
                },

                nextTab() { if (this.tab < 6) { this.tab++; if(this.tab === 5) setTimeout(() => this.initChart(), 100); } },
                prevTab() { if (this.tab > 1) this.tab--; },
                onAgeChange() { this.persist(); },

                formatRupiah(num) {
                    if (isNaN(num)) return 'Rp 0';
                    return 'Rp ' + Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                },

                // Getters & Calculations
                get sisaWaktuPensiun() { return Math.max(0, this.formData.targetPensiun - this.formData.usiaSekarang); },
                get durasiPensiun() { return Math.max(0, this.formData.harapanHidup - this.formData.targetPensiun); },
                get totalHutangTab2() { return (this.formData.cicilanUtang || 0) * (this.formData.sisaBulanCicilan || 0); },
                
                get multiplierDD() {
                    const org = this.formData.tanggunganOrg;
                    if (org <= 2) return 3;
                    if (org <= 4) return 6;
                    return 12;
                },

                get totalAsetBersih() {
                    const nilaiEmas = (this.formData.emasGram || 0) * (this.formData.hargaEmasGram || 0);
                    return (this.formData.hartaTunai || 0) + (this.formData.hartaInvestasi || 0) + nilaiEmas + (this.formData.hartaPribadi || 0) - this.totalHutangTab2;
                },

                get kelincahanKekayaan() {
                    const nilaiEmas = (this.formData.emasGram || 0) * (this.formData.hargaEmasGram || 0);
                    const likuid = (this.formData.hartaTunai || 0) + (this.formData.hartaInvestasi || 0) + nilaiEmas;
                    return this.totalAsetBersih > 0 ? (likuid / this.totalAsetBersih) * 100 : 0;
                },

                get ketahananKeuangan() {
                    const totalAsetKotor = (this.formData.hartaTunai || 0) + (this.formData.hartaInvestasi || 0) + ((this.formData.emasGram || 0) * (this.formData.hargaEmasGram || 0)) + (this.formData.hartaPribadi || 0);
                    return totalAsetKotor > 0 ? (this.totalHutangTab2 / totalAsetKotor) * 100 : 0;
                },

                get pengeluaranPensiunBulanan() {
                    const inflasi = 0.04;
                    const tahun = this.sisaWaktuPensiun;
                    return (this.formData.pengeluaranRutin || 0) * Math.pow(1 + inflasi, tahun);
                },

                get totalBebanTanggungan() {
                    return (this.formData.listTanggungan || []).reduce((acc, item) => acc + (item.nominal || 0), 0);
                },

                get totalRencanaKhusus() {
                    return (this.formData.listRencana || []).reduce((acc, item) => acc + (item.nominal || 0), 0);
                },

                get totalKebutuhanDanaPensiun() {
                    const bebanBulanan = this.pengeluaranPensiunBulanan + (this.totalBebanTanggungan / Math.max(1, this.durasiPensiun * 12));
                    return bebanBulanan * (this.durasiPensiun * 12);
                },

                get totalDanaCairAwal() {
                    const nilaiEmas = (this.formData.emasGram || 0) * (this.formData.hargaEmasGram || 0);
                    return (this.formData.hartaTunai || 0) + (this.formData.hartaInvestasi || 0) + nilaiEmas + (this.formData.estimasiJHT || 0) + (this.formData.estimasiDPLK || 0) + (this.formData.estimasiPesangon || 0) - this.totalRencanaKhusus;
                },

                get targetDanaDarurat() {
                    return (this.pengeluaranPensiunBulanan) * this.multiplierDD;
                },

                get persenModalBisnis() {
                    return this.totalDanaCairAwal > 0 ? ((this.formData.modalBisnisNominal || 0) / this.totalDanaCairAwal) * 100 : 0;
                },

                get ember3Emas() {
                    const sisa = this.totalDanaCairAwal - this.targetDanaDarurat - (this.formData.modalBisnisNominal || 0) - (this.formData.ember2Sukuk || 0);
                    return Math.max(0, sisa);
                },

                get hasilKetahananBulan() {
                    const danaBersih = Math.max(0, this.totalDanaCairAwal - (this.formData.modalBisnisNominal || 0));
                    const pengeluaranTotal = this.pengeluaranPensiunBulanan + (this.totalBebanTanggungan / 12) - (this.formData.targetProfitBisnis || 0) - (this.formData.passiveIncomePensiun || 0) - (((this.formData.ember2Sukuk || 0) * ((this.formData.kuponSukukPersen || 0)/100)) / 12);
                    if (pengeluaranTotal <= 0) return 999;
                    return Math.round(danaBersih / pengeluaranTotal);
                },

                addTanggungan() { this.formData.listTanggungan.push({ jenis: 'Pendidikan Anak', nominal: 1000000, sisaBulan: 12 }); this.persist(); },
                removeTanggungan(i) { this.formData.listTanggungan.splice(i, 1); this.persist(); },
                addRencana() { this.formData.listRencana.push({ jenis: 'Ibadah Haji/Umroh', nominal: 25000000 }); this.persist(); },
                removeRencana(i) { this.formData.listRencana.splice(i, 1); this.persist(); },

                // Chart.js Integration
                chartInstance: null,
                initChart() {
                    const ctx = document.getElementById('bucketChart');
                    if (!ctx) return;
                    if (this.chartInstance) this.chartInstance.destroy();

                    this.chartInstance = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Ember 1 (DD)', 'Ember 2 (Sukuk)', 'Ember 3 (Emas)', 'Modal Bisnis'],
                            datasets: [{
                                data: [
                                    this.targetDanaDarurat,
                                    this.formData.ember2Sukuk,
                                    this.ember3Emas,
                                    this.formData.modalBisnisNominal
                                ],
                                backgroundColor: ['#F2B01E', '#E2DCCD', '#4A3B32', '#16A34A']
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } }
                        }
                    });
                },
                updateChart() {
                    if (this.chartInstance) {
                        this.chartInstance.data.datasets[0].data = [
                            this.targetDanaDarurat,
                            this.formData.ember2Sukuk,
                            this.ember3Emas,
                            this.formData.modalBisnisNominal
                        ];
                        this.chartInstance.update();
                    }
                },

                // AI Summary & Liquidation
                get aiAnalysisSummary() {
                    const ketahanan = this.hasilKetahananBulan;
                    if (ketahanan >= (this.durasiPensiun * 12)) {
                        return `Analisis Gemini Flash Lite: Selamat! Struktur 3 Ember Anda sangat kokoh. Estimasi ketahanan dana mencapai ${ketahanan} bulan, melampaui harapan hidup masa pensiun Anda. Alokasi Ember 1 (Dana Darurat), Ember 2 (Sukuk), dan Ember 3 (Emas) sudah seimbang menghadapi inflasi 4%.`;
                    } else {
                        return `Analisis Gemini Flash Lite: Perhatian! Estimasi ketahanan dana Anda saat ini sekitar ${ketahanan} bulan, masih di bawah durasi target masa pensiun. Disarankan memperbesar alokasi Ember 3 (Emas) atau mengoptimalkan target profit bisnis sampingan untuk menutupi defisit arus kas.`;
                    }
                },

                get rekomendasiLikuidasiAset() {
                    const defisit = this.totalKebutuhanDanaPensiun - this.totalDanaCairAwal;
                    if (defisit <= 0) {
                        return `👏🏻 Surplus Tercapai! Dana Anda melebihi angka harapan hidup. Anda berada di jalur yang tepat untuk menikmati masa pensiun tenang dan meninggalkan warisan berharga untuk anak cucu.`;
                    } else {
                        const hargaEmas = this.formData.hargaEmasGram || 1200000;
                        const gramTerjual = Math.ceil(defisit / hargaEmas);
                        return `⚠️ Terdeteksi Defisit Sekitar ${this.formatRupiah(defisit)}. Saran Strategis PRea: Cairkan/jual terlebih dahulu aset emas Anda sebanyak ±${gramTerjual} gram (senilai kebutuhan defisit). Jika masih belum mencukupi, baru pertimbangkan likuidasi sebagian harta pribadi atau properti sekunder.`;
                    }
                },

                exportToPDF() {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(16);
                    doc.text("RINGKASAN EKSEKUTIF - KALKULATOR PRea", 15, 20);
                    
                    doc.setFontSize(10);
                    doc.setFont("helvetica", "normal");
                    doc.text("Nama: " + this.formData.nama, 15, 30);
                    doc.text("Usia Sekarang / Target Pensiun: " + this.formData.usiaSekarang + " / " + this.formData.targetPensiun + " Tahun", 15, 37);
                    doc.text("Total Aset Bersih: " + this.formatRupiah(this.totalAsetBersih), 15, 44);
                    doc.text("Total Kebutuhan Pensiun: " + this.formatRupiah(this.totalKebutuhanDanaPensiun), 15, 51);
                    doc.text("Estimasi Ketahanan Dana: " + this.hasilKetahananBulan + " Bulan", 15, 58);
                    
                    doc.setFont("helvetica", "bold");
                    doc.text("Kesimpulan AI:", 15, 70);
                    doc.setFont("helvetica", "normal");
                    doc.text(doc.splitTextToSize(this.aiAnalysisSummary, 180), 15, 77);

                    doc.save("Ringkasan-Eksekutif-PRea-" + this.formData.nama + ".pdf");
                }
            }));
        });
    </script>
